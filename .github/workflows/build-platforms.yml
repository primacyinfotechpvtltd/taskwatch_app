name: Build Task Watch for Windows, macOS, and Linux

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IDENTIFIER: com.primacyinfotech.pitaskwatch

jobs:
  build-windows:
    name: Build & Package Windows App
    runs-on: windows-2022

    env:
      HAS_WINDOWS_CERTS: ${{ secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERT_PASSWORD != '' }}
      HAS_WINDOWS_SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rustflags: ""  # disable -D warnings so platform-gated imports don't break CI

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Fastforge configs
        run: python generate_fastforge_configs.py

      - name: Import Code Signing Certificate (optional)
        if: ${{ env.HAS_WINDOWS_CERTS }}
        shell: powershell
        run: |
          $securePfxBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}")
          $securePfxPath = "$env:TEMP\signing-cert.pfx"
          [IO.File]::WriteAllBytes($securePfxPath, $securePfxBytes)
          $pwd = ConvertTo-SecureString "${{ secrets.WINDOWS_CERT_PASSWORD }}" -AsPlainText -Force
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "My", "CurrentUser"
          $store.Open("ReadWrite")
          $store.Add((New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($securePfxPath, $pwd, "Exportable,PersistKeySet")))
          $store.Close()
          Remove-Item $securePfxPath
          Write-Host "Certificate imported"

      - name: Build Windows App (Release)
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: flutter build windows --release

      - name: Sign Windows Executables (optional)
        if: ${{ env.HAS_WINDOWS_CERTS && env.HAS_WINDOWS_SIGNING_SUBJECT }}
        shell: powershell
        env:
          SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $exe = Get-ChildItem "build\windows\x64\runner\Release" -Filter "*.exe" -Recurse
          $dlls = Get-ChildItem "build\windows\x64\runner\Release" -Filter "*.dll" -Recurse
          foreach ($file in ($exe + $dlls)) {
              Write-Host "Signing $($file.Name)..."
              $signResult = & signtool.exe sign /n "$env:SIGNING_SUBJECT" /t http://timestamp.digicert.com $file.FullName 2>&1
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "  Timestamp failed, trying without timestamp..."
                  signtool.exe sign /n "$env:SIGNING_SUBJECT" $file.FullName
              }
              Write-Host "  Signed: $($file.Name)"
          }

      - name: Bundle MSVC C++ Runtime DLLs for Universal Windows 10/11 Compatibility
        shell: powershell
        run: |
          $ReleaseDir = "build\windows\x64\runner\Release"
          Write-Host "Copying MSVC Runtime DLLs to $ReleaseDir for Windows 10/11 clean install compatibility..."

          # Find VC Redist DLL directory on GitHub Actions Windows-2022 runner
          $VcRedistDirs = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue
          if ($VcRedistDirs) {
              $LatestVcRedist = $VcRedistDirs | Sort-Object Name -Descending | Select-Object -First 1
              $X64Redist = Join-Path $LatestVcRedist.FullName "x64\Microsoft.VC143.CRT"
              if (Test-Path $X64Redist) {
                  Write-Host "Found VC Runtime at $X64Redist"
                  Copy-Item -Path "$X64Redist\*.dll" -Destination $ReleaseDir -Force
              }
          }

          # Fallback: Check System32 for standard C++ runtime DLLs
          $RequiredDlls = @("msvcp140.dll", "msvcp140_1.dll", "msvcp140_2.dll", "vcruntime140.dll", "vcruntime140_1.dll", "vcruntime140_threads.dll", "vcomp140.dll")
          foreach ($dll in $RequiredDlls) {
              $destPath = Join-Path $ReleaseDir $dll
              if (-not (Test-Path $destPath)) {
                  $sysPath = "C:\Windows\System32\$dll"
                  if (Test-Path $sysPath) {
                      Write-Host "Copying $dll from System32..."
                      Copy-Item -Path $sysPath -Destination $destPath -Force
                  }
              }
          }
          Write-Host "Bundled DLLs in release directory:"
          Get-ChildItem -Path $ReleaseDir -Filter "*.dll" | Select-Object Name

      - name: Build Installer and Package (Fastforge)
        id: fastforge_pack
        continue-on-error: true
        run: |
          dart pub global activate fastforge
          # Add pub-cache bin directory to PATH
          $env:Path += ";$env:USERPROFILE\.pub-cache\bin"
          fastforge package --platform windows --targets exe

      - name: Create ZIP Fallback Artifact
        run: |
          mkdir -p dist/zip
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\zip\PI_Task_Watch_Windows_v1.0.34.zip

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PI-Task-Watch-Windows-Installer
          path: dist/windows/exe/*.exe
          if-no-files-found: ignore

      - name: Upload Windows ZIP Release
        uses: actions/upload-artifact@v4
        with:
          name: PI-Task-Watch-Windows-ZIP
          path: dist/zip/*.zip

  build-macos:
    name: Build & Package macOS App
    runs-on: macos-latest

    env:
      HAS_MACOS_CERTS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""  # disable -D warnings so platform-gated imports don't break CI

      - name: Install Rust targets for macOS universal build
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Fastforge configs
        run: python generate_fastforge_configs.py

      - name: Import Code Signing Certificate (optional)
        if: ${{ env.HAS_MACOS_CERTS }}
        continue-on-error: true
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Write base64 cert to a temp file to avoid heredoc size limits
          KEYCHAIN_PWD="ci-build-keychain"
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PWD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/cert.p12 -f pkcs12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          rm /tmp/cert.p12
          echo "imported"

      - name: Build macOS App (Release)
        env:
          CODE_SIGNING_ALLOWED: ${{ secrets.MACOS_CERT_P12 != '' && 'YES' || 'NO' }}
          CODE_SIGNING_REQUIRED: ${{ secrets.MACOS_CERT_P12 != '' && 'YES' || 'NO' }}
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '-' }}
          EXPANDED_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY || '-' }}
        run: flutter build macos --release

      - name: Notarize macOS App (optional)
        if: ${{ env.HAS_MACOS_CERTS }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/macos/Build/Products/Release/PI Task Watch.app"
          # Staple notarization ticket to the app
          xcrun notarytool submit "$APP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          echo "Notarization complete"

      - name: Build DMG Package (Fastforge)
        id: fastforge_pack
        continue-on-error: true
        run: |
          dart pub global activate fastforge
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform macos --targets dmg

      - name: Create ZIP Fallback Artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/zip"
          cd "$GITHUB_WORKSPACE/build/macos/Build/Products/Release/"
          zip -r "$GITHUB_WORKSPACE/dist/zip/PI_Task_Watch_macOS_v1.0.34.zip" "PI Task Watch.app"

      - name: Upload macOS DMG Installer
        uses: actions/upload-artifact@v4
        with:
          name: PI-Task-Watch-macOS-DMG
          path: dist/macos/dmg/*.dmg
          if-no-files-found: ignore

      - name: Upload macOS ZIP Release
        uses: actions/upload-artifact@v4
        with:
          name: PI-Task-Watch-macOS-ZIP
          path: dist/zip/*.zip

  build-linux:
    name: Build & Package Linux App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          rustflags: ""  # disable -D warnings so platform-gated imports don't break CI

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev libx11-dev libxcb1-dev libxtst-dev libxrandr-dev libssl-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Fastforge configs
        run: python generate_fastforge_configs.py

      - name: Build Linux App (Release)
        run: flutter build linux --release

      - name: Build DEB Package (Fastforge)
        id: fastforge_pack
        continue-on-error: true
        run: |
          dart pub global activate fastforge
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fastforge package --platform linux --targets deb

      - name: Create ZIP Fallback Artifact
        run: |
          mkdir -p dist/zip
          cd build/linux/x64/release/bundle/
          zip -r ../../../../../dist/zip/PI_Task_Watch_Linux_v1.0.34.zip .

      - name: Upload Linux DEB Package
        uses: actions/upload-artifact@v4
        with:
          name: PI-Task-Watch-Linux-DEB
          path: dist/linux/deb/*.deb
          if-no-files-found: ignore

      - name: Upload Linux ZIP Release
        uses: actions/upload-artifact@v4
        with:
          name: PI-Task-Watch-Linux-ZIP
          path: dist/zip/*.zip

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: PI-Task-Watch-*
          path: release
          merge-multiple: true

      - name: Determine Release Tag
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
            echo "TAG=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag_info.outputs.TAG }}"
          echo "Publishing release for tag: $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "PI Task Watch $TAG" --generate-notes
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
